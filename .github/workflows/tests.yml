name: Pipeline regression tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-regression:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-11
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-11-11
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
      - name: Compile source and regression tests
        run: python -m compileall -q src models tests scripts
      - name: Run regressions (CUDA is explicitly skipped on CPU runners)
        run: python -m pytest --junitxml=test-results.xml
      - name: Exercise synthetic pipeline
        run: python scripts/smoke_benchmark.py --output smoke-results.json
      - name: Preserve executed test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, resolved 2026-11-11
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results.xml
            smoke-results.json
          if-no-files-found: error
          retention-days: 14
